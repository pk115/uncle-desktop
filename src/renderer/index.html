<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self' capri: blob:; connect-src 'self' capri: wss://api.elevenlabs.io wss://api.us.elevenlabs.io wss://api.eu.elevenlabs.io wss://api.in.elevenlabs.io">
  <title>Uncle Desktop</title>
  <link rel="stylesheet" href="styles/capri.css">
</head>
<body>
  <div id="capri" class="capri">
    <canvas id="sprite" class="capri__sprite" aria-label="Capri"></canvas>
  </div>

  <canvas id="fx" class="fx" aria-hidden="true"></canvas>

  <canvas id="chip" class="chip" hidden aria-label="Capri’s biochip"></canvas>
  <canvas id="mask" class="chip" hidden aria-label="Capri, asleep"></canvas>

  <aside id="panel" class="panel" data-kind="info" hidden aria-live="polite">
    <div class="panel__frame">
      <div class="panel__plate">
        <figure class="panel__face" aria-hidden="true">
          <img src="../../assets/capri/capri-face.png" alt="">
        </figure>
        <div class="panel__body">
          <header class="panel__meta">
            <span class="panel__who">Capri</span>
            <span class="panel__tag"></span>
            <span class="panel__state"></span>
          </header>
          <p class="panel__line"></p>
          <p class="panel__quote" hidden></p>
          <div class="panel__progress" hidden><span class="panel__bar"></span></div>
          <div class="panel__reply" hidden></div>
          <section class="panel__report" hidden></section>
          <p class="panel__summary" hidden></p>
          <ol class="panel__log" hidden></ol>
          <div class="panel__actions" hidden></div>
          <form class="panel__chat" hidden autocomplete="off">
            <input class="panel__input" type="text" maxlength="500" spellcheck="false">
            <button class="panel__action is-primary panel__send" type="submit"></button>
            <button class="panel__action panel__close" type="button">✕</button>
          </form>
          <p class="panel__note" hidden></p>
        </div>
      </div>
      <div class="panel__tail" aria-hidden="true"></div>
    </div>
  </aside>

  <div id="ticker" class="ticker" hidden>
    <div class="ticker__plate">
      <span class="ticker__dot" aria-hidden="true"></span>
      <span class="ticker__verb"></span>
      <span class="ticker__target"></span>
    </div>
  </div>

  <section id="character-picker" class="character-picker" hidden></section>
  <section id="speech-settings" hidden></section>
  <section id="listening-settings" hidden></section>
  <section id="computer-settings" hidden></section>
  <button id="computer-stop" class="speech-stop computer-stop" type="button" hidden>■ หยุดงานควบคุมเครื่อง</button>
  <section id="all-settings" hidden></section>
  <button id="listening-stop" class="speech-stop listening-stop" type="button" hidden>■ ปิดไมโครโฟน</button>
  <button id="speech-stop" class="speech-stop" type="button" hidden>■ หยุดเสียงพูด</button>
  <link rel="stylesheet" href="styles/character-picker.css">
  <script src="vendor/elevenlabs-client.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
